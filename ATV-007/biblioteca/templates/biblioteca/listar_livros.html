<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Listar livros</title>
</head>
<body>
    <main>
        <h1>Lista de livros</h1>
        <button><a href="{% url 'biblioteca:criar_autor' %}">Criar Autor</a></button>
        <button><a href="{% url 'biblioteca:criar_livro' %}">Criar Livro</a></button>
        {% for livro in livros %}
           <p> <strong>Título:</strong> {{ livro.titulo }} </p>
           {% for autor in livro.autores.all %}
               <a href="{% url 'biblioteca:author_detail' autor.id %}">
                   <p> <strong>Autor:</strong> {{ autor.nome }} </p>
               </a>
           {% endfor %}
           <p> <strong>Ano de publicação:</strong>{{ livro.ano_publicacao }}</p>
           <button><a href="{% url 'biblioteca:editar_livro' livro.id %}">Editar</a></button>
           <hr width="25%" align="left">
        {% endfor %}
    </main>
</body>
</html>
