<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trocar de Tema</title>
    <style>
        .fundo-escuro {
            background-color: #333;
            color: #fff;
        }
    </style>
</head>
<body>
    <main>
        <h1>
            Página que troca de tema!
        </h1>

        <button id="trocarTema">Trocar de Tema</button>
    </main>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const body = document.body;
            const button = document.getElementById('trocarTema');

            button.addEventListener('click', function() {
                body.classList.toggle('fundo-escuro');
            });
        });
    </script>
</body>
</html>
